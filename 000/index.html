<style>
table, th, td {
  border: 1px solid rgb(0, 0, 0);
  border-collapse: collapse;
}
th, td {
  background-color: #96D4D4;
}
</style>
<script>
    document.write("<h1> 資訊三乙 董晏銘 九九乘法表</h1> ");
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");

</script>
</head>

<body>
    <h2> 資訊三乙 董晏銘 九九乘法表</h2>
</body>
</html>
