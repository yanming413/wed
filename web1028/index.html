<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>燈泡開關</title>
  <style>
    body {
      background-color: #eef4ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>資訊三乙 董晏銘</h1>
  <h2>燈泡開關</h2>

  <img id="myImage" src="pic/pic_bulboff.gif" width="100" height="180" alt="燈泡">

  <p id="status">目前狀態：關閉</p>

  <button onclick="light(1)">開燈</button>
  <button onclick="light(0)">關燈</button>

  <p>切換次數：<span id="count">0</span></p>

  <script>
    var isOn = false;
    var count = 0;

    function light(sw) {
      if (isOn != sw) {
        count = count + 1;
        document.getElementById("count").innerHTML = count;
      }

      if (sw == 1) {
        document.getElementById("myImage").src = "pic/pic_bulbon.gif";
        document.getElementById("status").innerHTML = "目前狀態：開啟";
        isOn = true;
      } else {
        document.getElementById("myImage").src = "pic/pic_bulboff.gif";
        document.getElementById("status").innerHTML = "目前狀態：關閉";
        isOn = false;
      }
    }
  </script>
</body>
</html>
